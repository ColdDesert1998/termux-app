
name: Build and Publish Termux Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.118.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: termux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package_variant }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package_variant:
          - apt-android-7
          - apt-android-5

    steps:
      # 1. Checkout source
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Setup JDK
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 4. Prepare release information
      - name: Prepare release information
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="$INPUT_TAG"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG_NAME"
            exit 1
          fi

          VERSION="${TAG_NAME#v}"

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "TERMUX_APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "TERMUX_APK_VERSION_TAG=${TAG_NAME}+${{ matrix.package_variant }}-signed" >> "$GITHUB_ENV"

      # 5. Decode release keystore
      - name: Setup release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ||
                -z "$KEYSTORE_PASSWORD" ||
                -z "$KEY_ALIAS" ]]; then
            echo "::error::Missing release keystore secrets"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/termux-signing"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/termux-signing/release.jks"

          chmod 600 "$RUNNER_TEMP/termux-signing/release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/termux-signing/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      # 6. Configure Gradle release signing
      - name: Configure Release signing
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")

          if not path.exists():
              raise SystemExit("app/build.gradle not found")

          content = path.read_text()

          old_signing = """    signingConfigs {
                  debug {"""

          new_signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("TERMUX_RELEASE_KEYSTORE"))
                      storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }

                  debug {"""

          if old_signing not in content:
              raise SystemExit("Cannot locate signingConfigs block")

          content = content.replace(old_signing, new_signing, 1)

          old_release = """        release {
                      minifyEnabled true"""

          new_release = """        release {
                      signingConfig signingConfigs.release
                      minifyEnabled true"""

          if old_release not in content:
              raise SystemExit("Cannot locate release buildType block")

          content = content.replace(old_release, new_release, 1)

          path.write_text(content)

          print("Release signing configuration applied successfully")
          PY

      # 7. Build signed APK
      - name: Build signed Release APK
        shell: bash
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}

          TERMUX_RELEASE_KEYSTORE: ${{ runner.temp }}/termux-signing/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # 8. Verify APK signature and generate checksum
      - name: Verify APK and generate checksum
        shell: bash
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          APK_NAME="termux-app_${TAG_NAME}+${PACKAGE_VARIANT}-signed_universal.apk"

          APK_PATH="$APK_DIR/$APK_NAME"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::Expected APK not found: $APK_PATH"
            echo "Actual build outputs:"
            find app/build/outputs/apk -type f
            exit 1
          fi

          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$APKSIGNER" verify --verbose "$APK_PATH"

          mkdir -p dist

          cp "$APK_PATH" "dist/$APK_NAME"

          cd dist

          sha256sum "$APK_NAME" > "checksums-${PACKAGE_VARIANT}.txt"

          cat "checksums-${PACKAGE_VARIANT}.txt"

      # 9. Upload build artifacts
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-${{ matrix.package_variant }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      # 10. Cleanup signing materials
      - name: Cleanup signing materials
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/termux-signing"

  # 11. Publish GitHub Release
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release information
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="$INPUT_TAG"
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

          cat > dist/BUILD-INFO.txt <<EOF
          Termux Custom Signed Release

          Version: $TAG_NAME

          Package variants:
          - apt-android-7
          - apt-android-5

          Signature: Custom release keystore
          EOF

          echo "Release files:"
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Termux ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.txt
