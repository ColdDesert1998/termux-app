name: Build and Release

on:
  push:
    tags:
      - 'v*'                     # 推送 v 开头的 tag 时触发，例如 v0.118.1
  workflow_dispatch:             # 也允许手动触发（可选）

permissions:
  contents: write                # 创建 Release 需要写权限

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [apt-android-7, apt-android-5]   # termux-app 的两个包变体

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
        # 需要提前在 Settings → Secrets 中配置 RELEASE_KEYSTORE_BASE64
      # --- 新增以下步骤 ---
      - name: Accept all Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        # 路径可能因 Runner 环境而异，如果失败，可尝试以下备选路径：
        # run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
        # 或更早期的路径：
        # run: yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses

      - name: Build release APKs
        env:
          TERMUX_PACKAGE_VARIANT: ${{ matrix.package_variant }}
          RELEASE_VERSION_NAME: ${{ github.ref_name }}   # tag 名称，如 v0.118.1
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Locate and rename APKs
        id: apk-files
        run: |
          APK_DIR="./app/build/outputs/apk/release"
          ls -lh "$APK_DIR"
          VERSION="${{ github.ref_name }}"
          VARIANT="${{ matrix.package_variant }}"
          for f in "$APK_DIR"/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .apk)
            newname="termux-app_${VERSION}_${VARIANT}_${base}.apk"
            mv "$f" "$APK_DIR/$newname"
          done
          echo "APK_DIR=$APK_DIR" >> $GITHUB_OUTPUT

      - name: Generate SHA256 checksums
        run: |
          cd ${{ steps.apk-files.outputs.APK_DIR }}
          sha256sum *.apk > SHA256SUMS

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-release-${{ matrix.package_variant }}
          path: |
            ${{ steps.apk-files.outputs.APK_DIR }}/*.apk
            ${{ steps.apk-files.outputs.APK_DIR }}/SHA256SUMS

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/**/*.apk
            ./artifacts/**/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
